server {
        listen 80 default_server;
        listen [::]:80 default_server;

        server_name _;
        root /usr/share/nginx/html;

        # Add index.php to the list if you are using PHP
        index index.html;

        # Serve the site for captive portal connectivity checks. Apple expects
        # a different response than "Success" to open its sign-in sheet.
        location ~ ^/(generate_204|gen_204|hotspot-detect\.html|library/test/success\.html|ncsi\.txt|connecttest\.txt|success\.txt|canonical\.html)$ {
                try_files /index.html =404;
                add_header Cache-Control "no-store";
        }

        location / {
                # First attempt to serve request as file, then
                # as directory, then fall back to the site index.
                try_files $uri $uri/ /index.html;
        }

}
